<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">
          <h4 class="card-title mb-4">Account Audit Reports</h4>
          <p class="text-muted mb-4">Export the parsed JSON data into a fully formatted Excel template.</p>
          
          <button class="btn btn-success btn-lg px-4" (click)="onDownloadExcel()">
            <i class="bi bi-file-earmark-spreadsheet me-2"></i> Download Excel
          </button>
          
        </div>
      </div>
    </div>
  </div>
</div>
